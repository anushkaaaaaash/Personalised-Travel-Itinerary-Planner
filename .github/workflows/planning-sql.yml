name: Planning queue SQL
on:
  push:
    paths: ['docs/adaptive_saved_archive_REVIEW_ONLY.sql', 'backend-python/migrations/*.sql', 'backend-python/tests/sql/**', 'backend-python/app/adaptive*.py', 'backend-python/app/section_repository.py', 'backend-python/tests/test_adaptive*.py', '.github/workflows/planning-sql.yml']
  pull_request:
    paths: ['docs/adaptive_saved_archive_REVIEW_ONLY.sql', 'backend-python/migrations/*.sql', 'backend-python/tests/sql/**', 'backend-python/app/adaptive*.py', 'backend-python/app/section_repository.py', 'backend-python/tests/test_adaptive*.py', '.github/workflows/planning-sql.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix backend-python/tests/sql --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix backend-python/tests/sql
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend-python/requirements.txt
      - name: Restricted gateway and PUBLIC privilege exploit regression
        run: python -m pytest -q -c backend-python/pytest.ini backend-python/tests/test_planning_postgres.py backend-python/tests/test_adaptive_postgres.py backend-python/tests/test_adaptive_integration.py
      - name: Disposable true-loopback native PostgreSQL checks
        run: bash backend-python/tests/sql/run_native_ci.sh
