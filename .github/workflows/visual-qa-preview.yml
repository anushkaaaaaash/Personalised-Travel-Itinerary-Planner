# TEMPORARY draft-preview verification. Remove/disable with public/__qa before main merge.
name: Preview visual QA
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['frontend/**', '.github/workflows/visual-qa-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-synthetic-preview:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == true &&
       github.head_ref == 'rebuild/travel-product' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'rebuild/travel-product')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      QA_TOOLS_DIR: /tmp/travel-visual-tools
      QA_ARTIFACT_DIR: ${{ github.workspace }}/visual-qa-artifacts
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install existing application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install matching pinned Playwright driver
        run: npm install --prefix "$QA_TOOLS_DIR" --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.64.1
      - name: Render real components with synthetic fixtures and build static preview
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$QA_ARTIFACT_DIR"
          node frontend/tools/renderQaPreview.mjs 2>&1 | tee "$QA_ARTIFACT_DIR/fixture-render.log"
          npm run build --workspace=frontend 2>&1 | tee "$QA_ARTIFACT_DIR/build.log"
      - name: Capture desktop and mobile layouts without external requests
        run: node frontend/tools/captureQaScreenshots.mjs
      - name: Upload screenshots and render diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travel-visual-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: visual-qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
