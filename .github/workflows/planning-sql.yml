name: Planning queue SQL
on:
  push:
    paths: ['backend-python/migrations/003_planning_jobs_REVIEW_ONLY.sql', 'backend-python/tests/sql/**', '.github/workflows/planning-sql.yml']
  pull_request:
    paths: ['backend-python/migrations/003_planning_jobs_REVIEW_ONLY.sql', 'backend-python/tests/sql/**', '.github/workflows/planning-sql.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: planning_queue_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d planning_queue_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix backend-python/tests/sql --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix backend-python/tests/sql
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend-python/requirements.txt
      - name: Restricted gateway and PUBLIC privilege exploit regression
        run: python -m pytest -q -c backend-python/pytest.ini backend-python/tests/test_planning_postgres.py
      - name: Independent PostgreSQL connections and stale-CAS tests
        run: python3 backend-python/tests/sql/planning_jobs_postgres.py
        env:
          PLANNING_SQL_TEST_DATABASE_URL: postgresql://postgres:disposable-test-password@127.0.0.1:5432/planning_queue_test
