name: Roamora visual QA
on:
  pull_request:
    paths: ['frontend/**', 'shared/**', '.github/workflows/roamora-visual.yml']
  push:
    branches: ['rebuild/fly-experience']
    paths: ['frontend/**', 'shared/**', '.github/workflows/roamora-visual.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked application dependencies
        run: npm ci --ignore-scripts
      - name: Run frontend regression tests
        run: npm test --workspace=frontend
      - name: Build real production client without QA routes
        run: npm run build --workspace=frontend
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/roamora-tools" --no-save --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/roamora-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check real UI with synthetic local API responses only
        env:
          QA_NODE_MODULES: ${{ runner.temp }}/roamora-tools/node_modules
          QA_OUTPUT: ${{ runner.temp }}/roamora-visual
        run: node frontend/tools/visualQa.mjs
      - name: Retain screenshots and assertions for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roamora-visual-${{ github.sha }}
          path: ${{ runner.temp }}/roamora-visual
          retention-days: 7
          if-no-files-found: warn
