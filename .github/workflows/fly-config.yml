name: Fly full-app container
on:
  pull_request:
    paths: ['Dockerfile', '.dockerignore', 'fly.toml', 'deployment/dockerignore-test/**', 'backend-python/**', 'frontend/**', 'shared/**', 'package*.json', 'deployment/frontend_config.mjs', 'deployment/pdf_container_smoke.py', '.github/workflows/fly-config.yml']
  push:
    branches: [main]
    paths: ['Dockerfile', '.dockerignore', 'fly.toml', 'deployment/dockerignore-test/**', 'backend-python/**', 'frontend/**', 'shared/**', 'package*.json', 'deployment/frontend_config.mjs', 'deployment/pdf_container_smoke.py', '.github/workflows/fly-config.yml']
permissions:
  contents: read
jobs:
  offline-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: deployment/dockerignore-test/go.sum
      - name: Verify Docker ignore semantics against actual pinned Moby matcher
        run: cd deployment/dockerignore-test && go test -v
      - name: Build public frontend and Python runtime image
        run: docker build --tag travel-api-offline .
      - name: Production factory smoke test with synthetic settings and no network
        shell: bash
        run: |
          docker volume create travel-checkpoints-offline
          docker run -d --name travel-api-offline --network none --mount source=travel-checkpoints-offline,target=/data \
            -e API_HOST=api.example.test -e FRONTEND_ORIGIN=https://api.example.test \
            -e SAVED_ITINERARIES_SCHEMA_VERIFIED=true \
            -e SUPABASE_URL=https://synthetic.supabase.co \
            -e SUPABASE_PUBLISHABLE_KEY=sb_publishable_synthetic \
            -e OPENAI_API_KEY=synthetic-provider-only \
            -e PLANNING_JOBS_ENABLED=false travel-api-offline
          for i in $(seq 1 30); do
            if docker exec travel-api-offline python -c 'import urllib.request; r=urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8080/api/health",headers={"Host":"api.example.test"})); assert r.status==200'; then break; fi
            sleep 1
          done
          docker exec travel-api-offline python -c 'import os,json,urllib.request; assert os.getuid()==10001; req=urllib.request.Request("http://127.0.0.1:8080/api/auth/config",headers={"Host":"api.example.test"}); result=json.load(urllib.request.urlopen(req)); assert result["planning_jobs_enabled"] is False; assert not os.path.exists("/app/.env"); print("PASS: non-root production health and disabled background capability with no network")'
      - name: Verify packaged PDF fonts and real PDF rendering without network
        run: docker exec -i travel-api-offline python - < deployment/pdf_container_smoke.py
      - name: Verify same-origin public UI and protected API in the real image
        shell: bash
        run: |
          docker exec -i travel-api-offline python - <<'PYCODE'
          import json,re,urllib.request,urllib.error
          def request(path):
              return urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8080"+path,headers={"Host":"api.example.test"}),timeout=5)
          html=request("/").read().decode()
          assert '<div id="root"></div>' in html
          asset=re.search(r'src="(/assets/[^" ]+\.js)"',html).group(1)
          js=request(asset).read().decode()
          assert 'planning_jobs_enabled' in js
          assert request("/itineraries/synthetic-id").read().decode()==html
          assert json.load(request("/api/health"))["backend"]=="fastapi"
          for path in ("/api/saved-itineraries","/api/unknown","/.env","/__qa/index.html"):
              try:request(path)
              except urllib.error.HTTPError as error:assert error.code in (401,404)
              else:raise AssertionError("Protected/private path became public")
          print("PASS: real React assets and detail route share origin with guarded API")
          PYCODE
      - name: Verify mounted SQLite initialization and persistent ready capability without network
        shell: bash
        run: |
          docker exec --user 0 -e ADAPTIVE_PREFLIGHT_APPROVED=true -e ADAPTIVE_SQLITE_INITIALIZE_APPROVED=true travel-api-offline python -m app.adaptive_sqlite_preflight --initialize
          docker exec travel-api-offline python -c 'import os,stat; s=os.stat("/data/checkpoints/planning.sqlite3"); assert s.st_uid==10001 and stat.S_IMODE(s.st_mode)==0o600; assert os.path.ismount("/data")'
          docker rm -f travel-api-offline
          docker run -d --name travel-api-offline --network none --mount source=travel-checkpoints-offline,target=/data \
            -e API_HOST=api.example.test -e FRONTEND_ORIGIN=https://api.example.test \
            -e SAVED_ITINERARIES_SCHEMA_VERIFIED=true -e SUPABASE_URL=https://synthetic.supabase.co \
            -e SUPABASE_PUBLISHABLE_KEY=sb_publishable_synthetic -e OPENAI_API_KEY=synthetic-provider-only \
            -e PLANNING_JOBS_ENABLED=false -e ADAPTIVE_PLANNING_ENABLED=true -e PLANNING_WORKER_TRANSPORT=sqlite \
            -e OPENAI_BACKGROUND_RETENTION_APPROVED=true -e PLANNING_DATA_RETENTION_APPROVED=true \
            -e ADAPTIVE_SCHEMA_VERIFIED=true -e ADAPTIVE_CLEANUP_VERIFIED=true -e ADAPTIVE_WORKER_VERIFIED=true \
            -e ADAPTIVE_RESOURCE_POLICY_APPROVED=true -e ADAPTIVE_SQLITE_STORAGE_APPROVED=true \
            -e ADAPTIVE_SQLITE_VOLUME_VERIFIED=true -e ADAPTIVE_SQLITE_SINGLE_MACHINE_VERIFIED=true \
            -e ADAPTIVE_SQLITE_SNAPSHOTS_DISABLED=true travel-api-offline
          for i in $(seq 1 30); do
            if docker exec travel-api-offline python -c 'import json,urllib.request; r=json.load(urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8080/api/auth/config",headers={"Host":"api.example.test"}))); assert r["adaptive_planning_enabled"] is True'; then break; fi
            sleep 1
          done
          docker exec travel-api-offline python -c 'import json,urllib.request,sqlite3; r=json.load(urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8080/api/auth/config",headers={"Host":"api.example.test"}))); assert r["adaptive_planning_enabled"] is True and r["adaptive_planning_policy"]["maxSubmissionsPerRun"]==12; c=sqlite3.connect("/data/checkpoints/planning.sqlite3"); assert c.execute("select count(*) from plans").fetchone()[0]==0; print("PASS: mounted private SQLite survives restart with ready capability, no network or provider calls")'
      - name: Verify explicit schema upgrade and grounded readiness without network
        shell: bash
        run: |
          docker rm -f travel-api-offline
          docker run --rm --user 0 --network none --mount source=travel-checkpoints-offline,target=/data \
            -e ADAPTIVE_PLANNING_ENABLED=false -e ADAPTIVE_RESEARCH_ENABLED=false -e ADAPTIVE_STREAMING_ENABLED=false \
            -e PLANNING_JOBS_ENABLED=false travel-api-offline python -m app.grounded_sqlite_upgrade --path /data/checkpoints/planning.sqlite3 --approve
          docker run --rm --network none --mount source=travel-checkpoints-offline,target=/data \
            travel-api-offline python -m app.grounded_sqlite_upgrade --path /data/checkpoints/planning.sqlite3 --check
          docker run --rm --network none --mount source=travel-checkpoints-offline,target=/data \
            -e OPENAI_API_KEY=synthetic-provider-only travel-api-offline python -c '
          import asyncio,sqlite3,os
          from app.adaptive_activation import SQLITE_APPROVALS
          from app.grounded_activation import RESEARCH_APPROVALS,build_grounded
          config={**dict.fromkeys(SQLITE_APPROVALS,"true"),**dict.fromkeys(RESEARCH_APPROVALS,"true"),"ADAPTIVE_PLANNING_ENABLED":"true","PLANNING_WORKER_TRANSPORT":"sqlite","ADAPTIVE_RESEARCH_ENABLED":"true","ADAPTIVE_RESEARCH_MAX_TOOLS":"6","ADAPTIVE_STREAMING_ENABLED":"true","OPENAI_API_KEY":os.environ["OPENAI_API_KEY"]}
          engine=build_grounded(config)
          asyncio.run(engine.verify_ready())
          assert engine.capability_ready()
          assert engine.public_policy()["researchMode"]=="on_demand" and engine.public_policy()["selectedDayRevisions"] is True
          c=sqlite3.connect("/data/checkpoints/planning.sqlite3")
          assert c.execute("PRAGMA user_version").fetchone()[0]==2
          for table in ("plans","sections","research_jobs","revision_jobs"):assert c.execute("SELECT COUNT(*) FROM "+table).fetchone()[0]==0
          asyncio.run(engine.close())
          print("PASS: explicit mounted schema2 upgrade and grounded factory ready, no network or paid calls")'
      - name: Remove synthetic container
        if: always()
        run: |
          docker rm -f travel-api-offline || true
          docker volume rm travel-checkpoints-offline || true
